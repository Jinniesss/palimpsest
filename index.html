<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Palimpsest" />
<meta name="theme-color" content="#060914" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Palimpsest</title>
<style>
  :root {
    --bg0:#03050c; --bg1:#070b19; --bg2:#101a36;
    --text:#eef1f8; --muted:#8c95ab; --faint:#586078;
    --line:rgba(255,255,255,.09); --glass:rgba(16,22,42,.78); --fill:rgba(255,255,255,.07);
    --accent:#cfd8ff;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --tab-h: 58px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { position:fixed; top:0; right:0; bottom:0; left:0; margin:0; padding:0; overflow:hidden; background:#050813; }
  body {
    position:fixed; top:0; right:0; bottom:0; left:0; margin:0; padding:0; overflow:hidden; overscroll-behavior:none;
    background: radial-gradient(120% 90% at 50% 38%, var(--bg2) 0%, var(--bg1) 55%, var(--bg0) 100%) #050813;
    color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input, textarea, select { -webkit-user-select:text; user-select:text; font-family: inherit; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
  #app { position:fixed; top:0; right:0; bottom:0; left:0; overflow:hidden; }

  .page { position:absolute; inset:0; display:none; }
  .page.on { display:block; }

  /* ---------- Sky ---------- */
  #sky { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #sky-head {
    position:absolute; top:0; left:0; right:0; padding: calc(var(--sat) + 14px) 22px 0;
    pointer-events:none; display:flex; align-items:baseline; justify-content:space-between;
  }
  #sky-head h1 { margin:0; font-size:17px; font-weight:600; letter-spacing:.01em; color: rgba(238,241,248,.92); }
  #sky-head span { font-size:13px; color: var(--muted); }
  #empty-hint {
    position:absolute; left:0; right:0; top:46%; text-align:center; color: var(--muted);
    font-size:15px; pointer-events:none; display:none;
  }
  #fab {
    position:absolute; right:20px; bottom: calc(var(--tab-h) + var(--sab) + 18px);
    width:52px; height:52px; border-radius:26px;
    background: rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    display:flex; align-items:center; justify-content:center;
    transition: opacity .2s, transform .2s;
  }
  #fab:active { transform: scale(.94); }
  #fab svg { width:22px; height:22px; stroke:#fff; stroke-width:2; stroke-linecap:round; fill:none; }
  body.sheet-open #fab { opacity:0; pointer-events:none; }

  /* ---------- Tab bar ---------- */
  #tabbar {
    position:absolute; left:0; right:0; bottom:0; height: calc(var(--tab-h) + var(--sab));
    padding-bottom: var(--sab);
    display:flex; background: rgba(8,12,26,.72);
    -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    border-top:1px solid var(--line); z-index:30;
  }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color: var(--faint); font-size:10.5px; font-weight:500; transition: color .2s; }
  .tab svg { width:23px; height:23px; stroke: currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .tab.on { color:#fff; }

  /* ---------- Bottom sheet (non-modal) ---------- */
  #sheet {
    position:absolute; left:0; right:0; bottom: calc(var(--tab-h) + var(--sab));
    max-height: 62dvh; display:flex; flex-direction:column;
    background: var(--glass); border:1px solid var(--line); border-bottom:0;
    border-radius: 22px 22px 0 0;
    -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5);
    transform: translateY(110%); transition: transform .34s cubic-bezier(.2,.8,.2,1);
    z-index:20; max-width:560px; margin:0 auto;
  }
  #sheet.on { transform: translateY(0); }
  #sheet .grab { flex:none; padding:9px 0 4px; display:flex; justify-content:center; touch-action:none; }
  #sheet .grab i { width:38px; height:4.5px; border-radius:3px; background: rgba(255,255,255,.22); }
  #sheet-body { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding: 4px 22px 22px; }

  .chip { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color: var(--muted); font-weight:500; }
  .chip i, .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex:none; }
  .status { font-size:12px; color:#b9a8ff; margin-left:10px; }
  h2.t { margin:8px 0 4px; font-size:23px; line-height:1.22; font-weight:650; letter-spacing:-.01em; }
  .meta { margin:0 0 14px; font-size:13px; color: var(--faint); }
  .desc { margin:0 0 18px; font-size:16px; line-height:1.5; color: rgba(238,241,248,.88); white-space:pre-wrap; }
  .desc.empty { color: var(--faint); }
  h3.sec { margin:20px 0 8px; font-size:13px; font-weight:600; color: var(--muted); }
  .list { background: var(--fill); border-radius:14px; overflow:hidden; }
  .li { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; font-size:15.5px; }
  .li + .li { border-top:1px solid var(--line); }
  .li .main { flex:1; min-width:0; }
  .li .main b { display:block; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li .main small { display:block; font-size:12.5px; color: var(--muted); margin-top:1px; }
  .li .chev { color: var(--faint); font-size:18px; }
  .li:active { background: rgba(255,255,255,.06); }
  .actions { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; padding:13px 14px; border-radius:13px; font-size:16px; font-weight:600; text-align:center; background: var(--fill); }
  .btn.primary { background: rgba(207,216,255,.92); color:#0b1226; }
  .btn.danger { color:#ff8a96; }
  .btn:active { opacity:.7; }
  .empty-note { padding:14px; color: var(--faint); font-size:14.5px; }

  /* bond sheet */
  .bond-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin: 6px 0 6px; }
  .pill { padding:7px 12px; border-radius:16px; background: var(--fill); font-size:14px; font-weight:500; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rel { font-size:13px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .tchip { display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:18px; background: var(--fill); font-size:14px; border:1px solid transparent; }
  .tchip.on { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.13); }
  textarea.field, input.field, select.field {
    width:100%; background: var(--fill); border:1px solid transparent; border-radius:13px;
    color: var(--text); font-size:16px; padding:12px 14px; outline:none; line-height:1.45;
  }
  textarea.field { resize:none; }
  .field:focus { border-color: rgba(207,216,255,.5); }
  .field.err { border-color:#ff7a8a; }
  ::placeholder { color: var(--faint); }

  /* ---------- Modal editor ---------- */
  #modal { position:absolute; top:0; right:0; bottom:0; left:0; z-index:50; display:none; align-items:center; justify-content:center; padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px); background: rgba(2,4,10,.6); opacity:0; transition: opacity .25s; }
  #modal.on { display:flex; }
  #modal.show { opacity:1; }
  .modal-card {
    width:100%; max-width:480px; max-height:100%; display:flex; flex-direction:column; overflow:hidden;
    background: rgba(14,19,38,.97); border-radius:24px; border:1px solid rgba(255,255,255,.12);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    transform: scale(.95); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  #modal.show .modal-card { transform:none; }
  .modal-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 10px; }
  .modal-title { font-size:16px; font-weight:600; }
  .link { font-size:16px; color: var(--accent); }
  .link.strong { font-weight:600; }
  .modal-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding: 6px 20px 26px; }
  .flabel { margin: 18px 0 7px; font-size:13px; font-weight:600; color: var(--muted); }
  .flabel:first-child { margin-top:6px; }
  .crow { display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px; }
  .crow + .crow { border-top:1px solid var(--line); }
  .crow .ttl { flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select.mini { background: rgba(255,255,255,.1); color: var(--text); border:0; border-radius:10px; padding:7px 8px; font-size:14px; max-width:46%; outline:none; }
  .xbtn { width:30px; height:30px; border-radius:15px; color: var(--muted); font-size:20px; line-height:30px; text-align:center; flex:none; }
  .addrow { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .addrow select { flex:1; min-width:0; }
  .addrow .btn { flex:none; padding:11px 14px; font-size:15px; }

  .dom-wrap { display:flex; align-items:center; gap:8px; }
  .dom-row { flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 0 4px; scrollbar-width:none; }
  .dom-row::-webkit-scrollbar { display:none; }
  .pencil { flex:none; width:36px; height:36px; border-radius:18px; background: var(--fill); display:flex; align-items:center; justify-content:center; }
  .pencil svg { width:18px; height:18px; stroke: var(--accent); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .dchip { flex:none; display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:18px; font-size:14px; border:1px solid transparent; white-space:nowrap; }
  .dchip small { color: var(--muted); font-size:12px; }
  .lrow + .lrow, .lrow + .lrow-add { border-top:1px solid var(--line); }
  .lrow-main { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; }
  .lrow-main .main { flex:1; min-width:0; }
  .lrow-main .main b { display:block; font-weight:500; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lrow-main .main small { display:block; font-size:12.5px; color: var(--muted); margin-top:1px; }
  .lrow-main .chev { color: var(--faint); font-size:18px; }
  .lrow.open { background: rgba(255,255,255,.04); }
  .lrow-edit { padding: 2px 14px 14px; }
  .rm { margin-top:12px; color:#ff8a96; font-size:14.5px; font-weight:500; }
  .lrow-add { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 14px; color: var(--accent); font-size:15.5px; font-weight:500; }
  .lrow-add .plus { width:22px; height:22px; border-radius:11px; background: rgba(207,216,255,.16); display:inline-flex; align-items:center; justify-content:center; font-size:17px; line-height:1; }
  .name-in { flex:1; min-width:0; background:none; border:0; outline:none; color: var(--text); font-size:16px; padding:0; }
  .crow .sub { color: var(--muted); font-size:13px; padding-right:8px; }
  .crow { padding-right:10px; }
  .crow .addbtn { padding:4px 6px; }

  /* ---------- Settings ---------- */
  #page-settings { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  #settings-inner { max-width:560px; margin:0 auto; padding: calc(var(--sat) + 22px) 20px calc(var(--tab-h) + var(--sab) + 40px); }
  #settings-inner h1 { margin:0 0 18px; font-size:32px; font-weight:700; letter-spacing:-.02em; }
  .gt { margin: 26px 0 8px 16px; font-size:13px; color: var(--muted); }
  .group { background: var(--fill); border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px; min-height:48px; font-size:16px; }
  .row + .row { border-top:1px solid var(--line); }
  .row .grow { flex:1; min-width:0; }
  .row input.name { flex:1; min-width:0; background:none; border:0; outline:none; color: var(--text); font-size:16px; padding:0; }
  .row .sub { color: var(--muted); font-size:13px; }
  .row.tap { width:100%; text-align:left; }
  .row.tap:active { background: rgba(255,255,255,.06); }
  .row.red { color:#ff8a96; }
  .sw { position:relative; width:51px; height:31px; flex:none; }
  .sw input { position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; z-index:2; }
  .sw span { position:absolute; inset:0; border-radius:16px; background: rgba(255,255,255,.18); transition: background .2s; }
  .sw span::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; transition: transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.35); }
  .sw input:checked + span { background:#7a8cff; }
  .sw input:checked + span::after { transform: translateX(20px); }
  .sugg { display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px 14px; }
  .sugg button { padding:7px 12px; border-radius:16px; background: rgba(255,255,255,.09); font-size:13.5px; color: var(--accent); }
  .foot { margin:26px 16px 0; font-size:12.5px; color: var(--faint); line-height:1.5; }
  .addin { flex:1; min-width:0; background:none; border:0; outline:none; color: var(--text); font-size:16px; padding:0; }
  .addbtn { color: var(--accent); font-weight:600; font-size:15px; }
  input[type=file] { display:none; }

  @media (prefers-reduced-motion: reduce) {
    #sheet, .modal-card, #modal { transition:none; }
  }
</style>
</head>
<body>
<div id="app">

  <section class="page on" id="page-sky">
    <canvas id="sky"></canvas>
    <div id="sky-head"><h1>Palimpsest</h1><span id="count"></span></div>
    <div id="empty-hint">Tap + to add your first thought</div>
    <button id="fab" aria-label="Add thought"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <section class="page" id="page-settings"><div id="settings-inner"></div></section>

  <div id="sheet" aria-live="polite"><div class="grab" id="grab"><i></i></div><div id="sheet-body"></div></div>

  <nav id="tabbar">
    <button class="tab on" data-tab="sky">
      <svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.3 5.6.2-4.4 3.5 1.5 5.4L12 14.7 7.4 17.9l1.5-5.4L4.5 9l5.6-.2L12 3.5z"/></svg>Sky
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>Settings
    </button>
  </nav>

  <div id="modal"><div class="modal-card" id="modal-card"></div></div>
</div>

<script>
(function () {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
var $ = function (s, el) { return (el || document).querySelector(s); };
var TAU = Math.PI * 2;
var KEY = 'palimpsest.v2';
var FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif';
var REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function nrm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }
function ang(a, b) { return Math.acos(clamp(dot(a, b), -1, 1)); }
function wrapPi(x) { while (x > Math.PI) x -= TAU; while (x < -Math.PI) x += TAU; return x; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { var a = seed; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fib(n) { var out = []; for (var i = 0; i < n; i++) { var y = 1 - 2 * (i + .5) / n, r = Math.sqrt(1 - y*y), th = i * 2.399963229728653; out.push([Math.cos(th)*r, y, Math.sin(th)*r]); } return out; }
function fmtDate(ts) { try { return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } }
var colCache = {};
function rgb(hex) { if (colCache[hex]) return colCache[hex]; var h = hex.replace('#', ''); var v = [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; colCache[hex] = v; return v; }
function rgba(hex, a) { var c = rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')'; }
function mixWhite(hex, k, a) { var c = rgb(hex); return 'rgba(' + Math.round(c[0] + (255-c[0])*k) + ',' + Math.round(c[1] + (255-c[1])*k) + ',' + Math.round(c[2] + (255-c[2])*k) + ',' + a.toFixed(3) + ')'; }

/* =========================================================
   State + persistence
   ========================================================= */
var PALETTE = ['#F6D38A', '#F7A8CC', '#7ED8E8', '#B9A8FF', '#9EE6B0', '#FFB88A', '#8FB8FF', '#E6A8F7'];
var SUGGESTED = ['Money & Finances', 'Society & Politics', 'Creativity & Art', 'Learning & Ideas', 'Home & Place', 'Meaning & Belief', 'Technology'];
var CORE_TYPES = ['supports', 'contradicts', 'supersedes', 'related'];

var S = null;           // persisted state
var disp = {};          // display positions (not persisted)
var saveTimer = null;

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 150);
}

function tangentJitter(a, rand, spread) {
  var r = [rand() - .5, rand() - .5, rand() - .5];
  var t = nrm([r[0] - a[0]*dot(r, a), r[1] - a[1]*dot(r, a), r[2] - a[2]*dot(r, a)]);
  var m = spread * (.4 + .6 * rand());
  return nrm([a[0] + t[0]*m, a[1] + t[1]*m, a[2] + t[2]*m]);
}

function seed() {
  var A = fib(5), day = 86400000, now = Date.now();
  var domains = [
    { id: 'work',   name: 'Work & Career',      color: PALETTE[0], a: A[3] },
    { id: 'rel',    name: 'Relationships',      color: PALETTE[1], a: A[1] },
    { id: 'health', name: 'Health & Body',      color: PALETTE[2], a: A[0] },
    { id: 'growth', name: 'Personal Growth',    color: PALETTE[3], a: A[2] },
    { id: 'none',   name: 'Uncategorized',      color: '#D5D9E6',  a: A[4] }
  ];
  var types = [
    { id: 'supports',    name: 'Supports',    color: '#8EE6A0' },
    { id: 'contradicts', name: 'Contradicts', color: '#FF6F7D' },
    { id: 'supersedes',  name: 'Supersedes',  color: '#A99BFF', directed: true },
    { id: 'related',     name: 'Related',     color: '#C9D2EA' }
  ];
  var defs = [
    ['w1', 'work', 'Meaningful work matters more than a title', 'I would rather spend my days on problems I care about than climb a ladder I don\u2019t believe in.', 62],
    ['w2', 'work', 'Ambition is worth the cost', 'Pushing hard early in a career compounds. Rest can come later.', 41],
    ['w3', 'work', 'Deep focus beats long hours', 'Three clear hours outperform a whole day of half-attention.', 33],
    ['w4', 'work', 'Ask for feedback early', 'A rough draft shown early saves the polished one built in the wrong direction.', 20],
    ['r1', 'rel',  'Close friendships need regular effort', 'They don\u2019t maintain themselves. A small, steady gesture matters more than a big occasional one.', 55],
    ['r2', 'rel',  'Distance doesn\u2019t have to weaken a friendship', 'The right people stay close across time zones and silences.', 28],
    ['r3', 'rel',  'Say the hard thing kindly', 'Honesty and warmth aren\u2019t opposites. Delay usually makes it harder.', 12],
    ['h1', 'health', 'Rest is part of the work', 'Recovery is when the gains land, for the body and for the mind.', 47],
    ['h2', 'health', 'Movement keeps my mind clear', 'A walk resets things in a way that more screen time never does.', 36],
    ['h3', 'health', 'Sleep is non-negotiable', 'Everything else is worse without it.', 9],

function onTap(cx, cy) {
  var rect = canvas.getBoundingClientRect(), x = cx - rect.left, y = cy - rect.top;
  // thoughts
  var best = null, bd = 1e9;
  Object.keys(proj).forEach(function (id) {
    var n = proj[id]; if (n.z < .02) return;
    var d = Math.hypot(n.x - x, n.y - y), lim = Math.max(n.r * 1.8 + 6, 22);
    if (d < lim && d < bd) { bd = d; best = n; }
  });
  if (best) { selectNode(best.t.id); return; }
  // bonds
  var be = null, ed = 1e9;
  Object.keys(edgeProj).forEach(function (id) {
    var pts = edgeProj[id];
    for (var i = 0; i < pts.length - 1; i++) {
      if ((pts[i].z + pts[i + 1].z) / 2 < 0) continue;
      var d = segDist(x, y, pts[i], pts[i + 1]);
      if (d < 14 && d < ed) { ed = d; be = id; }
    }
  });
  if (be) { selectEdge(be); return; }
  // domain names
  for (var i2 = 0; i2 < labelBoxes.length; i2++) {
    var b = labelBoxes[i2];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { flyTo(b.v, Math.max(cam.zoom, 1.25)); return; }
  }
  if (sel) closeSheet();
}
function segDist(px, py, a, b) {
  var vx = b.x - a.x, vy = b.y - a.y, l2 = vx*vx + vy*vy;
  var t = l2 ? clamp(((px - a.x) * vx + (py - a.y) * vy) / l2, 0, 1) : 0;
  return Math.hypot(px - (a.x + t * vx), py - (a.y + t * vy));
}

/* =========================================================
   Bottom sheet: thought + bond details
   ========================================================= */
var sheetEl = $('#sheet'), sheetBody = $('#sheet-body');
var prevNode = null;

function openSheet() { sheetEl.classList.add('on'); document.body.classList.add('sheet-open'); }
function closeSheet() {
  sel = null; prevNode = null;
  sheetEl.classList.remove('on'); document.body.classList.remove('sheet-open');
}
function selectNode(id, noFly) {
  var t = thoughtById(id); if (!t) return;

  renderNodeSheet(t); openSheet();

}
function selectEdge(id) {

  var a = disp[l.a] || thoughtById(l.a).p, b = disp[l.b] || thoughtById(l.b).p;
  flyTo(nrm([a[0] + b[0], a[1] + b[1], a[2] + b[2]]), Math.max(cam.zoom, 1.2));
}

function linksOf(id) { return S.links.filter(function (l) { return l.a === id || l.b === id; }); }
function relLabel(l, fromId) {

}

var noteTimer = null;
sheetBody.addEventListener('input', function (ev) {
  if (ev.target.id !== 'bond-note') return;
  var l = linkById(ev.target.getAttribute('data-id')); if (!l) return;
  l.note = ev.target.value; clearTimeout(noteTimer); noteTimer = setTimeout(persist, 250);
});
sheetBody.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (act === 'edge') selectEdge(id);
  else if (act === 'close') closeSheet();
  else if (act === 'back') { if (prevNode && thoughtById(prevNode)) selectNode(prevNode, true); else closeSheet(); }
  else if (act === 'goto') { prevNode = null; selectNode(id); }
  else if (act === 'edit') openEditor(id);
  else if (act === 'settype') { var l = linkById(id); l.type = b.getAttribute('data-type'); persist(); renderEdgeSheet(l); }
  else if (act === 'swap') { var l2 = linkById(id); var tmp = l2.a; l2.a = l2.b; l2.b = tmp; persist(); renderEdgeSheet(l2); }
  else if (act === 'unlink') {
    if (!b.getAttribute('data-armed')) { b.setAttribute('data-armed', '1'); b.textContent = 'Tap again to remove'; return; }
    S.links = S.links.filter(function (x) { return x.id !== id; }); relax(S, 30); persist(); updateCount();

// swipe down on the handle to dismiss
(function () {
  var g = $('#grab'), y0 = null, dy = 0;
  g.addEventListener('pointerdown', function (e) { y0 = e.clientY; dy = 0; sheetEl.style.transition = 'none'; g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', function (e) { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheetEl.style.transform = 'translateY(' + dy + 'px)'; });
  function up() { if (y0 == null) return; sheetEl.style.transition = ''; sheetEl.style.transform = ''; if (dy > 70 || dy === 0) closeSheet(); y0 = null; }
  g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
})();

function renderEdLinks() {

          h += '<button class="tchip' + (l.type === 'supersedes:rev' ? ' on' : '') + '" data-act="ed-settype" data-key="' + l.key + '" data-type="supersedes:rev"><i class="dot" style="background:' + t.color + '"></i>Superseded by</button>';
        } else h += '<button class="tchip' + (l.type === t.id ? ' on' : '') + '" data-act="ed-settype" data-key="' + l.key + '" data-type="' + t.id + '"><i class="dot" style="background:' + t.color + '"></i>' + esc(t.name) + '</button>';

/* ----- picker: choose a domain, then search within it ----- */
function eligible() {
  var used = {}; ed.links.forEach(function (l) { used[l.other] = 1; });
  return S.thoughts.filter(function (t) { return t.id !== ed.id && !used[t.id]; });
}
function renderPicker() {
  var h = '<div class="modal-bar"><button class="link" data-act="pk-back">Back</button><div class="modal-title">Add connection</div><span style="width:44px"></span></div>';
  h += '<div class="modal-scroll"><div class="flabel">Domain</div><div class="dom-wrap"><div class="dom-row" id="pk-doms"></div></div>';
  h += '<input class="field" id="pk-q" type="search" placeholder="Search thoughts" autocomplete="off" style="margin-top:12px" value="' + esc(ed.pk.q) + '">';
  h += '<div class="list" id="pk-list" style="margin-top:12px"></div></div>';
  modalCard.innerHTML = h; renderPkDoms(); renderPkList();
}
function renderPkDoms() {
  var el = eligible(), cnt = {}; el.forEach(function (t) { cnt[t.domain] = (cnt[t.domain] || 0) + 1; });
  var h = chipHtml('pk-dom', 'all', 'All', '#C9D2EA', ed.pk.dom === 'all', el.length);
  S.domains.forEach(function (d) { if (cnt[d.id] || ed.pk.dom === d.id) h += chipHtml('pk-dom', d.id, d.name, d.color, ed.pk.dom === d.id, cnt[d.id] || 0); });
  var box = $('#pk-doms'); if (box) box.innerHTML = h;
}
function renderPkList() {
  var q = ed.pk.q.trim().toLowerCase(), items = eligible().filter(function (t) {
    if (ed.pk.dom !== 'all' && t.domain !== ed.pk.dom) return false;
    return !q || t.title.toLowerCase().indexOf(q) >= 0 || (t.body || '').toLowerCase().indexOf(q) >= 0;
  });
  var h = '';
  items.forEach(function (t) {
    var dm = domainOf(S, t.domain);
    h += '<button class="li" data-act="pk-add" data-id="' + t.id + '"><i class="dot" style="background:' + dm.color + '"></i><span class="main"><b>' + esc(t.title) + '</b>' + (ed.pk.dom === 'all' ? '<small>' + esc(dm.name) + '</small>' : '') + '</span></button>';
  });
  var box = $('#pk-list'); if (box) box.innerHTML = h || '<div class="empty-note">' + (q ? 'No thoughts match.' : 'No thoughts here yet.') + '</div>';
}

/* ----- domain manager ----- */
function renderDomEditor() {
  var h = '<div class="modal-bar"><span style="width:44px"></span><div class="modal-title">Domains</div><button class="link strong" data-act="dm-done">Done</button></div><div class="modal-scroll"><div class="list">';
  S.domains.forEach(function (d) {
    h += '<div class="crow"><i class="dot" style="background:' + d.color + '"></i><input class="name-in" data-edom="' + d.id + '" value="' + esc(d.name) + '" maxlength="32" ' + (d.id === 'none' ? 'readonly' : '') + '>' + (d.id === 'none' ? '<span class="sub">fallback</span>' : '<button class="xbtn" data-act="dm-del" data-id="' + d.id + '" aria-label="Delete domain">\u00d7</button>') + '</div>';
  });
  h += '<div class="crow"><input class="name-in" id="dm-new" maxlength="32" placeholder="New domain"><button class="addbtn" data-act="dm-add">Add</button></div></div>';
  var have = {}; S.domains.forEach(function (d) { have[d.name.toLowerCase()] = 1; });
  var sug = SUGGESTED.filter(function (s) { return !have[s.toLowerCase()]; });
  if (sug.length) { h += '<div class="flabel">Suggestions</div><div class="chips">'; sug.forEach(function (s) { h += '<button class="tchip" data-act="dm-sug" data-name="' + esc(s) + '">+ ' + esc(s) + '</button>'; }); h += '</div>'; }
  h += '<p class="foot" style="margin:18px 4px 0">Thoughts in a deleted domain move to Uncategorized.</p></div>';
  modalCard.innerHTML = h;
}

modalCard.addEventListener('input', function (ev) {
  if (!ed) return;
  if (ev.target.id === 'ed-title') { ed.title = ev.target.value; ev.target.classList.remove('err'); }
  else if (ev.target.id === 'ed-body') ed.body = ev.target.value;
  else if (ev.target.id === 'pk-q') { ed.pk.q = ev.target.value; renderPkList(); }
});
modalCard.addEventListener('change', function (ev) {
  if (!ed) return;
  var id = ev.target.getAttribute('data-edom');
  if (id) {
    var d = S.domains.filter(function (x) { return x.id === id; })[0], v = ev.target.value.trim();
    if (d && v) { d.name = v; persist(); } else if (d) ev.target.value = d.name;
  }
});
modalCard.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'dm-new') { ev.preventDefault(); edAddDomain(ev.target.value); }
});
function edAddDomain(name) {
  if (!createDomain(name)) return;
  renderDomEditor(); var i = $('#dm-new'); if (i) i.focus();
}
modalCard.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b || !ed) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), key = b.getAttribute('data-key');
  if (act === 'ed-cancel') closeEditor();
  else if (act === 'ed-save') saveEditor();
  else if (act === 'ed-dom') { ed.domain = id; renderEdDoms(); }
  else if (act === 'ed-doms') { ed.view = 'domains'; renderEditor(); }
  else if (act === 'dm-done') { if (!S.domains.some(function (d) { return d.id === ed.domain; })) ed.domain = 'none'; ed.view = 'form'; renderEditor(); }
  else if (act === 'dm-add') edAddDomain($('#dm-new').value);
  else if (act === 'dm-sug') edAddDomain(b.getAttribute('data-name'));
  else if (act === 'dm-del') {
    var d = S.domains.filter(function (x) { return x.id === id; })[0]; if (!d) return;
    if (!confirm('Delete \u201c' + d.name + '\u201d? Its thoughts move to Uncategorized.')) return;
    removeDomain(id); if (ed.domain === id) ed.domain = 'none'; renderDomEditor();
  }
  else if (act === 'ed-open') { ed.open = ed.open === key ? null : key; renderEdLinks(); }
  else if (act === 'ed-settype') { ed.links.forEach(function (l) { if (l.key === key) l.type = b.getAttribute('data-type'); }); renderEdLinks(); }
  else if (act === 'ed-rm') { ed.links = ed.links.filter(function (l) { return l.key !== key; }); ed.open = null; renderEdLinks(); }
  else if (act === 'ed-pick') { ed.view = 'pick'; ed.pk = { dom: 'all', q: '' }; renderEditor(); }
  else if (act === 'pk-back') { ed.view = 'form'; renderEditor(); }
  else if (act === 'pk-dom') { ed.pk.dom = id; renderPkDoms(); renderPkList(); }
  else if (act === 'pk-add') {
    var nk = 'n' + uid(); ed.links.push({ key: nk, lid: null, other: id, type: 'related' }); ed.open = nk; ed.view = 'form'; renderEditor();
    var row = modalCard.querySelector('.lrow.open'); if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
  }
  else if (act === 'ed-delete') {
    if (!b.getAttribute('data-armed')) { b.setAttribute('data-armed', '1'); b.textContent = 'Tap again to delete'; return; }
    var tid = ed.id;
    S.links = S.links.filter(function (l) { return l.a !== tid && l.b !== tid; });
    S.thoughts = S.thoughts.filter(function (t) { return t.id !== tid; }); delete disp[tid];
    relax(S, 30); persist(); updateCount(); closeEditor(); closeSheet();
  }
});

function saveEditor() {
  var title = (ed.title || '').trim();
  if (!title) { var i = $('#ed-title'); if (i) { i.classList.add('err'); i.focus(); } return; }
  var now = Date.now(), id = ed.id, t;
  if (!S.domains.some(function (d) { return d.id === ed.domain; })) ed.domain = 'none';
  if (id) {
    t = thoughtById(id); t.title = title; t.body = (ed.body || '').trim(); t.updated = now; t.domain = ed.domain;
  } else {
    id = uid(); var dm = domainOf(S, ed.domain), rand = rng(hash(id));
    t = { id: id, title: title, body: (ed.body || '').trim(), domain: ed.domain, created: now, updated: now, p: tangentJitter(dm.a, rand, .5) };
    S.thoughts.push(t);
  }
  var keep = {};
  ed.links.forEach(function (w) {
    var rev = w.type === 'supersedes:rev', ty = rev ? 'supersedes' : w.type;
    var a = rev ? w.other : id, b = rev ? id : w.other;
    if (w.lid) { var l = linkById(w.lid); if (l) { l.type = ty; l.a = a; l.b = b; keep[l.id] = 1; } }
    else {
      var dup = S.links.filter(function (l) { return (l.a === a && l.b === b) || (l.a === b && l.b === a); })[0];
      if (dup) { dup.type = ty; dup.a = a; dup.b = b; keep[dup.id] = 1; }
      else { var nl = { id: 'l' + uid(), a: a, b: b, type: ty, note: '', created: now }; S.links.push(nl); keep[nl.id] = 1; }
    }
  });
  S.links = S.links.filter(function (l) { if (l.a !== id && l.b !== id) return true; return !!keep[l.id]; });
  relax(S, 70); persist(); updateCount(); closeEditor();
  selectNode(id);
}

function nextColor() {
  var used = {}; S.domains.concat(S.types).forEach(function (d) { used[d.color.toUpperCase()] = 1; });
  for (var i = 0; i < PALETTE.length; i++) if (!used[PALETTE[i].toUpperCase()]) return PALETTE[i];
  return PALETTE[Math.floor(Math.random() * PALETTE.length)];
}
function newAnchor() {
  var cands = fib(500), ex = S.domains.map(function (d) { return d.a; }), best = cands[0], bd = -1;
  cands.forEach(function (c) { var m = 4; ex.forEach(function (e) { m = Math.min(m, ang(c, e)); }); if (m > bd) { bd = m; best = c; } });
  return best;
}

function renderSettings() {
  var h = '<h1>Settings</h1>';
  h += '<div class="gt">Sky</div><div class="group">' + toggleRow('twinkle', 'Twinkle') + toggleRow('rotate', 'Drift slowly') + toggleRow('names', 'Show domain names') + '</div>';

  h += '<div class="gt">Domains</div><div class="group">';
  S.domains.forEach(function (d) {
    var cnt = S.thoughts.filter(function (t) { return t.domain === d.id; }).length;
    h += '<div class="row"><i class="dot" style="background:' + d.color + '"></i><input class="name" data-dom="' + d.id + '" value="' + esc(d.name) + '" maxlength="32" ' + (d.id === 'none' ? 'readonly' : '') + '><span class="sub">' + cnt + '</span>' + (d.id === 'none' ? '' : '<button class="xbtn" data-act="deldom" data-id="' + d.id + '" aria-label="Delete domain">\u00d7</button>') + '</div>';
  });
  h += '<div class="row"><input class="addin" id="new-dom" maxlength="32" placeholder="New domain"><button class="addbtn" data-act="adddom">Add</button></div>';
  var have = {}; S.domains.forEach(function (d) { have[d.name.toLowerCase()] = 1; });
  var sug = SUGGESTED.filter(function (s) { return !have[s.toLowerCase()]; });
  if (sug.length) { h += '<div class="sugg">'; sug.forEach(function (s) { h += '<button data-act="sugdom" data-name="' + esc(s) + '">+ ' + esc(s) + '</button>'; }); h += '</div>'; }
  h += '</div>';

  h += '<div class="gt">Relationship types</div><div class="group">';
  S.types.forEach(function (t) {
    var core = CORE_TYPES.indexOf(t.id) >= 0;
    h += '<div class="row"><i class="dot" style="background:' + t.color + '"></i><input class="name" data-typ="' + t.id + '" value="' + esc(t.name) + '" maxlength="24">' + (t.directed ? '<span class="sub">directed</span>' : '') + (core ? '' : '<button class="xbtn" data-act="deltype" data-id="' + t.id + '" aria-label="Delete type">\u00d7</button>') + '</div>';
  });
  h += '<div class="row"><input class="addin" id="new-typ" maxlength="24" placeholder="New relationship type"><button class="addbtn" data-act="addtype">Add</button></div></div>';

  h += '<div class="gt">Data</div><div class="group">';
  h += '<button class="row tap" data-act="export">Export as file</button>';
  h += '<label class="row tap" for="import-file">Import from file</label><input type="file" id="import-file" accept="application/json,.json">';
  h += '<button class="row tap" data-act="reset">Reset to example thoughts</button>';
  h += '<button class="row tap red" data-act="erase">Erase everything</button></div>';
  h += '<p class="foot">' + S.thoughts.length + ' thoughts \u00b7 ' + S.links.length + ' connections. Everything is saved on this device, in this browser.</p>';
  setEl.innerHTML = h;
}

setEl.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.getAttribute('data-set')) { S.settings[t.getAttribute('data-set')] = t.checked; persist(); }
  else if (t.getAttribute('data-dom')) {
    var d = S.domains.filter(function (x) { return x.id === t.getAttribute('data-dom'); })[0];
    var v = t.value.trim(); if (d && v) { d.name = v; persist(); } else if (d) t.value = d.name;
  }
  else if (t.getAttribute('data-typ')) {
    var ty = typeById(t.getAttribute('data-typ')); var v2 = t.value.trim(); if (v2) { ty.name = v2; persist(); } else t.value = ty.name;
  }
  else if (t.id === 'import-file' && t.files && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result);
        if (!(o && o.domains && o.thoughts && o.links && o.types)) throw new Error('bad');
        if (!confirm('Replace everything with this file?')) return;
        S = o; S.settings = S.settings || { twinkle: true, rotate: true, names: true }; disp = {}; persist(); updateCount(); renderSettings();
      } catch (e) { alert('That file isn\u2019t a Palimpsest export.'); }
    };
    fr.readAsText(t.files[0]);
  }
});
setEl.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'new-dom') addDomain(ev.target.value);
  else if (ev.target.id === 'new-typ') addType(ev.target.value);
  else if (ev.target.getAttribute('data-dom') || ev.target.getAttribute('data-typ')) ev.target.blur();
});
function createDomain(name) {
  name = (name || '').trim(); if (!name) return null;
  var d = { id: 'd' + uid(), name: name, color: nextColor(), a: newAnchor() };
  S.domains.splice(S.domains.length - 1, 0, d); persist(); return d;
}
function removeDomain(id) {
  S.thoughts.forEach(function (t) { if (t.domain === id) t.domain = 'none'; });
  S.domains = S.domains.filter(function (x) { return x.id !== id; });
  relax(S, 120); persist();
}
function addDomain(name) { if (createDomain(name)) renderSettings(); }
function addType(name) {
  name = (name || '').trim(); if (!name) return;
  S.types.splice(S.types.length - 1, 0, { id: 't' + uid(), name: name, color: nextColor() });
  persist(); renderSettings();
}
setEl.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (act === 'adddom') addDomain($('#new-dom').value);
  else if (act === 'sugdom') addDomain(b.getAttribute('data-name'));
  else if (act === 'addtype') addType($('#new-typ').value);
  else if (act === 'deldom') {
    var d = S.domains.filter(function (x) { return x.id === id; })[0]; if (!d) return;
    if (!confirm('Delete \u201c' + d.name + '\u201d? Its thoughts move to Uncategorized.')) return;
    removeDomain(id); renderSettings();
  }
  else if (act === 'deltype') {
    var ty = typeById(id);
    if (!confirm('Delete \u201c' + ty.name + '\u201d? Connections of this type become Related.')) return;
    S.links.forEach(function (l) { if (l.type === id) l.type = 'related'; });
    S.types = S.types.filter(function (x) { return x.id !== id; }); persist(); renderSettings();
  }
  else if (act === 'export') {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'palimpsest-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  else if (act === 'reset') {
    if (!confirm('Replace everything with the example thoughts?')) return;
    S = seed(); disp = {}; persist(); updateCount(); renderSettings();
  }
  else if (act === 'erase') {
    if (!confirm('Erase all thoughts and connections? This can\u2019t be undone.')) return;
    S.thoughts = []; S.links = []; disp = {}; persist(); updateCount(); renderSettings();
  }
});

/* =========================================================
   Tabs + boot
   ========================================================= */
function setTab(t) {
  tab = t;
  $('#page-sky').classList.toggle('on', t === 'sky');
  $('#page-settings').classList.toggle('on', t === 'settings');
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
  if (t === 'settings') { if (sel) closeSheet(); renderSettings(); }
  else { resize(); }
}
document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });

function updateCount() {
  var n = S.thoughts.length;
  $('#count').textContent = n + (n === 1 ? ' thought' : ' thoughts');
  $('#empty-hint').style.display = n ? 'none' : 'block';
}

S = load();
S.thoughts.forEach(function (t) { disp[t.id] = t.p.slice(); });
(function bestView() {
  if (!S.thoughts.length) return;
  var best = null, bs = -1;
  fib(240).forEach(function (c) { var sc = 0; S.thoughts.forEach(function (t) { var d = dot(c, t.p); if (d > .25) sc += d; }); if (sc > bs) { bs = sc; best = c; } });
  var c = camFor(best); cam.yaw = c.yaw; cam.pitch = clamp(c.pitch * .8 - .12, -1.2, 1.2);
})();
updateCount();
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
persist();

// exposed for quick debugging in the console
window.__palimpsest = { get state() { return S; } };
})();
</script>
